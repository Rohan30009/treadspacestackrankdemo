function status(c){return c.finalized?'<span class="pill final">'+I('check',12)+' Evaluation Completed</span>':isOngoing(c)?'<span class="pill provisional">'+I('clock',12)+' Evaluation Ongoing</span>':c.rejected?'<span class="pill rejected">Evaluation Closed</span>':isScreened(c)?'<span class="pill neutral">Awaiting first evaluation</span>':'<span class="pill neutral">Not yet screened</span>';}
function statusName(c){return c.finalized?'Evaluation Completed':isOngoing(c)?'Evaluation Ongoing':c.rejected?'Evaluation Closed':isScreened(c)?'Awaiting first evaluation':'Not yet screened';}
function hasCompleteCoverage(c){return coverage(c)>99.99;}
function canFinalize(c){return !c.rejected&&hasCompleteCoverage(c)&&c.pending.length===0;}
function stageScore(c,key){const matches=c.rounds.filter(r=>r.template===key);return mean(matches.map(roundScore).filter(x=>x!==null));}
function getMetric(c){if(state.tab==='stage')return stageScore(c,state.stage);if(state.tab==='competency')return getCompetencies(c)[state.competency].score;return score(c);}
function filteredCandidates(forRank=false){
 let arr=candidates.filter(c=>forRank?(state.includeRejected||!c.rejected):true);
 if(!forRank){
   if(state.candidateFilter==='screened')arr=arr.filter(isScreened);
   if(state.candidateFilter==='ongoing')arr=arr.filter(isOngoing);
   if(state.candidateFilter==='final')arr=arr.filter(c=>c.finalized);
 }
 if(forRank){
   if(state.tab==='final')arr=arr.filter(c=>c.finalized);
   if(state.tab==='stage'||state.tab==='competency')arr=arr.filter(c=>getMetric(c)!=null);
   else arr=arr.filter(c=>score(c)!=null);
 }
 if(state.query.trim()){
   const q=state.query.trim().toLowerCase();
   arr=arr.filter(c=>c.name.toLowerCase().includes(q)||c.role.toLowerCase().includes(q));
 }
 return arr.sort((a,b)=>{
   if(state.sort==='name')return a.name.localeCompare(b.name);
   if(state.sort==='rounds')return b.rounds.length-a.rounds.length||(getMetric(b)||0)-(getMetric(a)||0);
   return (getMetric(b)??-1)-(getMetric(a)??-1)||a.name.localeCompare(b.name);
 });
}

 const path=`<div class="path" aria-label="Breadcrumb"><span class="path-job">Software Engineer Distributed Systems</span><span class="path-chevron">›</span><button class="path-link" data-action="nav" data-target="candidates">Candidates</button><span class="path-chevron">›</span><span class="path-current">StackRank</span></div>`;
 return `<header class="topbar">${path}<div class="top-actions"><button class="btn" data-action="nav" data-target="candidates">${I('arrow',16)} Back to Candidates</button></div></header>`;
}

}
function toolbar(){

 return `<div class="toolbar-card original-toolbar"><div class="toolbar-top"><label class="search-wrap">${I('search',22)}<input aria-label="Search candidates" data-search="1" placeholder="Search candidates..." value="${safe(state.query)}"/></label><button class="btn original-stack" data-action="nav" data-target="stackrank" title="Open StackRank">${I('rank',18)} StackRank</button><button class="btn" data-action="filter">${I('filter',18)}<span>Filter</span></button><button class="btn" data-action="sortmenu">${I('sort',18)}<span>Sort</span></button></div><div class="seg-stat-row">${items.map(([id,ic,num,label])=>`<button class="seg-stat ${state.originalTab===id?'selected':''}" data-action="originalTab" data-target="${id}">${I(ic,20)} <strong>${num}</strong> ${label}</button>`).join('')}</div></div>`;
}
function fitLabel(c){const s=score(c)||0;return s>=7.3?'Good':s>=5.5?'Fair':'Poor';}
function card(c){
 const s=score(c),m=screenshotProfiles[c.id],cs=getCompetencies(c);
 let details=[];
 if(m){details=m.points;}else{
  const ready=competencies.filter(x=>cs[x.id].score!==null).sort((a,b)=>cs[b.id].score-cs[a.id].score);
  if(ready[0])details.push(['green',`${ready[0].name} — demonstrated capability`]);
  if(ready[ready.length-1]&&ready.length>1)details.push(['red',`${ready[ready.length-1].name} — further verification recommended`]);
  const unknown=competencies.find(x=>cs[x.id].score===null);if(unknown)details.push(['red',`${unknown.name} — no direct evidence present`]);
 }
 const fit=m?.label || (s!=null?fitLabel(c):'—');
 const stage=m?.stage||(c.rejected?'REJECTED':c.pending.length?templates[c.pending[0]].name.toUpperCase():c.finalized?'EVALUATION COMPLETED':'AWAITING EVALUATION');
 const stageStatus=m?.stageStatus||(c.rejected||c.finalized?'':c.pending.length?'SCHEDULED':c.rounds.length?'EVALUATED':'');
 const fitClass=fit==='Good'?'good':fit==='Satisfactory'?'satisfactory':fit==='Fair'?'fair':'poor';
 return `<article class="candidate-card original-card" data-action="drawer" data-id="${safe(c.id)}" tabindex="0" aria-label="Open ${safe(c.name)} candidate evaluation"><div class="identity">${avatar(c)}<div class="candidate-id"><div class="name">${safe(c.name)}</div><div class="detail">${c.years} years of experience</div><div class="detail">Applied: ${safe(c.applied||'1 month ago')}</div><div class="detail" title="Software Engineer - Distributed Systems">Job: Software Engineer - Distributed Syst...</div></div></div><div class="evidence-preview">${details.map(([col,txt])=>`<div class="insight"><span class="dot ${col==='green'?'':col}"></span><span>${safe(txt)}</span></div>`).join('')}</div><div class="fit-area"><div class="fit ${fitClass}">${safe(fit)}</div></div><div class="round-info"><div class="round-name">${safe(stage)}${stageStatus?`<span>${safe(stageStatus)}</span>`:''}</div><div class="round-icons"><span class="circle-icon" title="View resume">${I('file',19)}</span><span class="circle-icon" title="View evaluation flow">${I('layers',19)}</span><span class="circle-icon" title="View analytics">${I('chart',19)}</span><span class="circle-icon" title="View evaluation details">${I('clipboard',19)}</span></div></div></article>`;
}
function candidatePage(){
 let arr=candidates.filter(c=>state.originalTab==='all'?true:state.originalTab==='ongoing'?!c.finalized&&!c.rejected:state.originalTab==='hold'?c.hiringStatus==='hold':state.originalTab==='offer'?c.hiringStatus==='offer':state.originalTab==='selected'?c.hiringStatus==='selected':true);
 if(state.query.trim()){const q=state.query.trim().toLowerCase();arr=arr.filter(c=>c.name.toLowerCase().includes(q)||c.role.toLowerCase().includes(q));}
 if(state.sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name));else arr.sort((a,b)=>{const ia=sourceOrder.indexOf(a.id),ib=sourceOrder.indexOf(b.id);return (ia<0?999:ia)-(ib<0?999:ib);});
 return `${header('Candidates')}<div class="content original-content">${toolbar()}<div class="candidate-list">${arr.length?arr.map(card).join(''):`<div class="empty">${I('search',28)}<strong>No candidates found</strong>Try another search or status.</div>`}</div></div>`;
}
function kpis(){const n=countData(); const items=[['file','Total Candidates',n.total,'All resumes received','all'],['users','Screened Candidates',n.screened,'Approved for at least one evaluation','screened'],['clock','Evaluation Ongoing',n.ongoing,'Active evaluation','ongoing'],['checkcircle','Evaluation Completed',n.completed,'Formally completed','final']];return `<div class="kpi-grid">${items.map(([ic,label,value,sub,id])=>`<button class="kpi stat-click" data-action="quickFilter" data-target="${id}" style="text-align:left;color:inherit"><div class="kpi-label">${I(ic,15)} ${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></button>`).join('')}</div>`;}
function rankPanel(){const tabs=[['overall','Overall Ranking'],['final','Evaluation Completed'],['stage','By Evaluation'],['competency','By Competency']];return `<section class="rank-panel"><div class="rank-panel-head"><div class="tabbar">${tabs.map(([id,label])=>`<button class="tab ${state.tab===id?'active':''}" data-action="tab" data-target="${id}">${label}</button>`).join('')}</div></div><div class="rank-controls"><div class="left">${state.tab==='stage'?`<select class="select" data-select="stage" aria-label="Select evaluation">${Object.entries(templates).map(([id,t])=>`<option value="${id}" ${state.stage===id?'selected':''}>${t.name}</option>`).join('')}</select>`:''}${state.tab==='competency'?`<select class="select" data-select="competency" aria-label="Select competency">${competencies.map(x=>`<option value="${x.id}" ${state.competency===x.id?'selected':''}>${x.name}</option>`).join('')}</select>`:''}<label class="search-wrap" style="max-width:260px;height:39px">${I('search',16)}<input aria-label="Search ranked candidates" data-search="1" placeholder="Find candidate..." value="${safe(state.query)}" /></label><label class="checkbox-wrap"><input type="checkbox" data-checkbox="rejected" ${state.includeRejected?'checked':''} />Include rejected</label></div><div class="right"><select class="select" data-select="sort" aria-label="Sort ranking"><option value="score" ${state.sort==='score'?'selected':''}>Highest FITCHECK</option><option value="rounds" ${state.sort==='rounds'?'selected':''}>Rounds completed</option><option value="name" ${state.sort==='name'?'selected':''}>Candidate name</option></select></div></div>${helperText()}${rankTable()}<div class="tablefoot"><span>${filteredCandidates(true).length} candidates displayed · Click a candidate for evaluation details</span><span>FITCHECK is advisory · Recruiter makes the final decision</span></div></section>`;}
function helperText(){let msg='Rankings use completed assessment results. Candidates with no evaluated rounds will appear after their first result is recorded.';if(state.tab==='final')msg='Only candidates marked Evaluation Completed appear here.';if(state.tab==='stage')msg='Compare candidates assessed in the selected evaluation round.';if(state.tab==='competency')msg='Compare demonstrated performance in the selected competency.';return `<div class="helper">${I('info',16)} <span>${msg}</span></div>`;}
function rankTable(){const arr=filteredCandidates(true);const metricLabel=state.tab==='stage'?'Assessment Rating':state.tab==='competency'?'Competency Rating':'FITCHECK';const base=candidates.filter(c=>(state.includeRejected||!c.rejected)&&(state.tab!=='final'||c.finalized)&&(state.tab==='stage'||state.tab==='competency'?getMetric(c)!=null:score(c)!=null)).sort((a,b)=>(getMetric(b)??-1)-(getMetric(a)??-1)||a.name.localeCompare(b.name));const ranks={};let last=null,rank=0;base.forEach((c,i)=>{const x=getMetric(c);if(last===null||Math.abs(x-last)>0.00001)rank=i+1;ranks[c.id]=rank;last=x;});return `<div class="table-overflow"><table class="rank-table"><thead><tr><th style="width:50px">Select</th><th style="width:60px">Rank</th><th>Candidate</th><th>${metricLabel}</th><th>Evaluations</th><th>Evaluation Status</th><th style="text-align:right">Details</th></tr></thead><tbody>${arr.map(c=>{let metric=getMetric(c);let ix=ranks[c.id];return `<tr data-action="drawer" data-id="${c.id}"><td><input aria-label="Compare ${safe(c.name)}" type="checkbox" data-action="toggleCompare" data-id="${c.id}" ${state.compare.has(c.id)?'checked':''}/></td><td><span class="rank-bubble ${ix<=3?'top':''}">${ix}</span></td><td><div class="table-person">${avatar(c,true)}<div><div class="name">${safe(c.name)}</div><div class="minor">${c.years} yrs experience${c.rejected?' · Hiring: Rejected':''}</div></div></div></td><td><div class="score-num">${fmt(metric)}<small> /10</small></div><div class="track"><div style="width:${metric==null?0:metric*10}%"></div></div></td><td><strong>${c.rounds.length}</strong><span class="subtle"> completed</span>${c.pending.length?`<div class="score-delta">${c.pending.length} scheduled</div>`:c.waived.length?`<div class="score-delta">${c.waived.length} waived</div>`:''}</td><td>${status(c)}</td><td style="text-align:right;color:#2484d9">${I('chevron',19)}</td></tr>`}).join('')}</tbody></table>${!arr.length?`<div class="empty">${I('search',27)}<strong>No assessed candidates found</strong>Try another evaluation, competency, or search.</div>`:''}</div>`;}
function rankPage(){return `${header('StackRank',true)}<div class="content">${kpis()}${rankPanel()}${state.compare.size>=2?`<div class="compare-floating"><strong>${state.compare.size} candidates selected</strong><button data-action="compare">Compare side-by-side</button><button data-action="clearCompare" style="background:transparent;color:#c4d8f4;padding:3px">${I('close',17)}</button></div>`:''}</div>`;}

en Evaluation':'Complete Evaluation'}</button>`:`<div class="notice-box">${c.rejected?'This application was rejected. Reopen the application before finalisation.':`Evaluation completion requires 100% weighted competency coverage and no outstanding required rounds. Current coverage: ${Math.round(cov)}%. Outstanding: ${c.pending.length}.`}</div>`}</div></div></aside>`;}

}
function render(preserveFocus=false){const el=document.activeElement;let focusData=null;if(preserveFocus&&el&&el.matches('input,textarea')){focusData={attr:el.hasAttribute('data-search')?'data-search':el.hasAttribute('data-weight')?'data-weight':el.hasAttribute('data-text')?'data-text':'',val:el.dataset.search?'1':el.dataset.weight||el.dataset.text||'',start:el.selectionStart??null,end:el.selectionEnd??null};}const scroll=window.scrollY;document.body.classList.toggle('original-screen',state.page==='candidates');document.getElementById('main').innerHTML=state.page==='stackrank'?rankPage():candidatePage();document.getElementById('overlays').innerHTML=(state.drawer?drawerHtml(candidates.find(c=>c.id===state.drawer)):'')+(state.modal?modalHtml():'');sidebar();if(focusData?.attr){const seek=`[${focusData.attr}="${focusData.val}"]`;const next=document.querySelector(seek);if(next){next.focus();if(focusData.start!==null&&typeof next.setSelectionRange==='function'&&next.type!=='range')try{next.setSelectionRange(focusData.start,focusData.end)}catch(e){}}}window.scrollTo(0,scroll);}
function toast(message){state.toast=message;let n=document.getElementById('toast');if(n)n.remove();n=document.createElement('div');n.id='toast';n.style.cssText='position:fixed;bottom:25px;right:24px;z-index:70;background:#112e52;color:#fff;padding:13px 17px;border-radius:11px;font-size:13px;box-shadow:0 10px 32px #122b5660;max-width:330px';n.textContent=message;document.body.appendChild(n);setTimeout(()=>n.remove(),3300);}
function nav(page){state.page=page;state.query='';state.drawer=null;state.modal=null;window.location.hash=page==='stackrank'?'stackrank':'candidates';window.scrollTo(0,0);render();}
function actionClick(e){const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,id=t.dataset.id;if(a==='quickFilter'){state.candidateFilter=t.dataset.target;nav('candidates');state.candidateFilter=t.dataset.target;render();return;} if(a==='approve'){const c=candidates.find(x=>x.id===id);if(c&&!isScreened(c)){c.approved=true;c.pending.push('aptitude');persist();render();toast('Candidate approved for evaluation. Technical Aptitude Test scheduled.');}return;} if(a==='recordPending'){const c=candidates.find(x=>x.id===id);if(!c)return;const index=Number(t.dataset.index),key=c.pending[index];if(!key)return;state.recordId=id;state.recordIndex=index;state.recordScore=7;state.modal='record';state.drawer=null;render();return;} if(a==='saveResult'){const c=candidates.find(x=>x.id===state.recordId);const key=c?.pending[state.recordIndex];if(!c||!key)return;const templ=templates[key];const n=clamp(Number(state.recordScore),0,10);c.rounds.push({id:c.id+'-'+key+'-'+Date.now(),template:key,name:templ.name,kind:templ.kind,scores:Object.fromEntries(templ.fields.map(f=>[f,n]))});c.pending.splice(state.recordIndex,1);c.finalized=false;state.modal=null;state.drawer=c.id;persist();render();toast('Assessment recorded; FITCHECK updated.');return;} if(a==='saveCandidate'){const field=document.getElementById('newCandidateName'),years=document.getElementById('newCandidateYears');const name=field?.value.trim(),exp=Number(years?.value);if(!name||name.length<2||!Number.isFinite(exp)||exp<0||years?.value===''){toast('Enter a name and valid years of experience.');return;}const id='candidate-'+Date.now();const c=mk(id,name,exp,0,[],[],false,false);c.applied='today';c.resumeFile=state.newResumeName||'';candidates.push(c);persist();state.newCandidateName='';state.newCandidateYears='';state.newResumeName='';state.modal=null;state.query='';nav('candidates');toast(name+' added to Total Candidates.');return;} if(a==='toggleCompare'){e.stopPropagation();if(state.compare.has(id))state.compare.delete(id);else if(state.compare.size>=3){toast('Choose up to 3 candidates for a clear comparison.');return;}else state.compare.add(id);render();return;}
 if(a==='nav'){nav(t.dataset.target);return;}
 if(a==='sidebar'){if(t.dataset.target==='candidates')nav('candidates');else toast('The StackRank demo is focused on the Candidates workspace.');return;}
 if(a==='drawer'){state.drawer=id;state.modal=null;render();return;}
 if(a==='close'){state.drawer=null;state.modal=null;state.waiveReason='';render();return;}
 if(a==='tab'){state.tab=t.dataset.target;state.sort='score';render();return;}
 if(a==='candidateFilter'){state.candidateFilter=t.dataset.target;render();return;}
 if(a==='originalTab'){state.originalTab=t.dataset.target;render();return;}
 if(a==='sortmenu'){state.sort=state.sort==='score'?'name':'score';toast(state.sort==='name'?'Sorted by candidate name':'Sorted by score');render();return;}
 if(a==='filter'){const modes=['all','ongoing','hold','offer','selected'];state.originalTab=modes[(modes.indexOf(state.originalTab)+1)%modes.length];render();return;}


 if(a==='compare'){state.modal='compare';state.drawer=null;render();return;}
 if(a==='clearCompare'){state.compare.clear();render();return;}
 if(a==='addRound'){const c=candidates.find(x=>x.id===id),key=state.newRoundComp,comp=competencies.find(x=>x.id===key);if(!c)return;const value=Number(state.newRoundScore);c.rounds.push({id:`${id}-extra-${Date.now()}`,template:'targeted',name:`Targeted ${comp.short} assessment`,kind:'Additional',scores:{[key]:value}});c.finalized=false;c.approved=true;persist();render();toast('Added a targeted round. FITCHECK recalculated without any round-count bonus.');return;}
 if(a==='finalize'){const c=candidates.find(x=>x.id===id);if(!c)return;if(c.finalized){c.finalized=false;toast('Evaluation Ongoing again. Previous evaluation results remain available.');}else if(canFinalize(c)){c.finalized=true;toast(`${c.name} marked Evaluation Completed and added to Completed StackRank.`);}else toast('Resolve outstanding rounds and evidence coverage before completing evaluation.');persist();render();return;}
 if(a==='waive'){state.waiveId=id;state.waiveIndex=Number(t.dataset.index);state.waiveReason='';state.modal='waive';render();return;}
 if(a==='confirmWaive'){if(state.waiveReason.trim().length<8)return;const c=candidates.find(x=>x.id===state.waiveId);if(!c)return;const key=c.pending.splice(state.waiveIndex,1)[0];c.waived.push({name:templates[key].name,reason:state.waiveReason.trim()});state.modal=null;state.waiveReason='';persist();render();toast('Round waived with a recorded rationale.');return;}


 if(a==='jd'||a==='upload'){state.modal=a;render();return;}
}
document.addEventListener('click',actionClick);
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.entry==='newCandidateName'){state.newCandidateName=t.value;return;}if(t.dataset.entry==='newCandidateYears'){state.newCandidateYears=t.value;return;}if(t.hasAttribute('data-search')){state.query=t.value;render(true);}else if(t.hasAttribute('data-weight')){state.weights[t.dataset.weight]=Number(t.value);render(true);}else if(t.dataset.text==='waiveReason'){state.waiveReason=t.value;const b=document.querySelector('[data-action="confirmWaive"]');if(b)b.disabled=state.waiveReason.trim().length<8;}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.select==='sort')state.sort=t.value;else if(t.dataset.select==='stage')state.stage=t.value;else if(t.dataset.select==='competency')state.competency=t.value;else if(t.dataset.select==='newComp')state.newRoundComp=t.value;else if(t.dataset.select==='newScore')state.newRoundScore=Number(t.value);else if(t.dataset.select==='recordScore')state.recordScore=Number(t.value);else if(t.dataset.entry==='resumeFile'){state.newResumeName=t.files?.[0]?.name||'';return;}else if(t.dataset.checkbox==='rejected')state.includeRejected=t.checked;else if(t.dataset.radio==='mode')state.mode=t.value;else return;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.modal||state.drawer)){state.modal=null;state.drawer=null;render();}});
window.addEventListener('hashchange',()=>{const next=location.hash==='#stackrank'?'stackrank':'candidates';if(state.page!==next){state.page=next;state.drawer=null;state.modal=null;state.query='';render();}});
render();
})();
</script>
</body>
</html>
